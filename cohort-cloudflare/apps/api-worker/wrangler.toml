# Cohort API worker (Clerk-verified). Deploys to the isolated TEST preview only.
name = "cohort-api-prep"
main = "src/index.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cohort-app-prep"
database_id = "7b7caf0c-8c3d-4ebc-8abf-5660eaab9f8f"

# R2 is intentionally NOT bound yet: R2 requires billing enrollment (separate user
# approval, item 4). The /health probe and file routes handle a missing binding.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "cohort-files-prep"

# Deploy-time (non-secret) vars for the isolated TEST preview. The PEM is Clerk's
# public verification key - safe in-repo. Secrets would go through wrangler secret.
[vars]
CLERK_ISSUER = "https://fond-escargot-8888.clerk.accounts.dev"
CLERK_AUTHORIZED_PARTIES = "https://cohort-test-preview.pages.dev,http://localhost:8789,http://localhost:8081"
CORS_ORIGINS = "https://cohort-test-preview.pages.dev,http://localhost:8789,http://localhost:8081"
# Item-2 PREVIEW-ONLY identity binding: synthetic Clerk dev-user subs allowed to
# bind to the same-id D1 profile row. Server-controlled; not a secret. Item 10
# replaces this with Backend-API external_id mapping for real users.
TEST_SUB_ALLOWLIST = "user_3LfjRoTDNbKKoIokRRE50PtERCb"
# Both required for the allowlist path (fail-closed otherwise): explicit opt-in
# plus the exact dev issuer it is pinned to.
PREVIEW_IDENTITY_BINDING = "enabled"
PREVIEW_DEV_ISSUER = "https://fond-escargot-8888.clerk.accounts.dev"
