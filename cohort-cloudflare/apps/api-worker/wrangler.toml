# Cohort API worker (Clerk-verified) - PREPARATION ONLY. Not deployed.
name = "cohort-api-prep"
main = "src/index.ts"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "cohort-app-prep"
