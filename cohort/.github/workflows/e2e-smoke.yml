name: e2e-smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route and backend smoke test against the live site
        run: node apps/mobile/scripts/e2e-smoke.mjs https://cohort-pi-eight.vercel.app
