# CI for the Cohort app (cohort/).
# NOTE: GitHub Actions only reads workflows from the repository root
# .github/workflows, so this lives at the repo root, not inside cohort/.
name: cohort-ci

on:
  pull_request:
    paths:
      - 'cohort/**'
      - '.github/workflows/cohort-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cohort/**'
      - '.github/workflows/cohort-ci.yml'

defaults:
  run:
    working-directory: cohort

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cohort/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
